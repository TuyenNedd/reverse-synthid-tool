[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthid-tool"
version = "0.1.0"
description = "Detect and remove SynthID watermarks from AI-generated images"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "opencv-python-headless>=4.5.0",
    "PyWavelets>=1.1.1",
    "scikit-learn>=0.24.0",
    "Pillow>=8.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
synthid = "synthid_tool.cli:app"
synthid-server = "backend.app:start_server"

[project.optional-dependencies]
full = [
    "torch>=2.0.0",
    "diffusers>=0.20.0",
    "safetensors>=0.3.0",
    "accelerate>=0.20.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "httpx>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["synthid_tool*", "backend*"]

[tool.setuptools.package-data]
synthid_tool = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
