version: "3.9"

services:
  synthid-tool:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SYNTHID_HOST=0.0.0.0
      - SYNTHID_PORT=8000
      - SYNTHID_ARTIFACTS_DIR=/app/artifacts
      - SYNTHID_RESULTS_DIR=/app/.results
      - SYNTHID_MAX_UPLOAD_SIZE=52428800
    volumes:
      - results:/app/.results
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  results:
